# @package _global_
# CNN + BiLSTM + CR-CTC: 3-layer CNN (kernel 11), 2-layer BiLSTM. Gradient clipping in base.
# For step-level warmup (first 500 steps), run with: lr_scheduler=linear_warmup_cosine_annealing_steps
module:
  _target_: emg2qwerty.lightning.CNNBiLSTMCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  # CNN stage: 3 layers, smaller kernel (11, odd for same padding) for stability with depth
  cnn_layers: 3
  cnn_kernel_size: 11
  # BiLSTM: 2 layers
  lstm_hidden: 128
  lstm_layers: 2
  dropout: 0.05  # reduced slightly from 0.1
  # CR-CTC (entropy weight increased slightly)
  use_cr_ctc: true
  cr_ctc_consistency_weight: 0.0
  cr_ctc_entropy_weight: 0.02

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
