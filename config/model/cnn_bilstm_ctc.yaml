# @package _global_
# CNN + BiLSTM + plain CTC (no CR-CTC). Same architecture as cnn_bilstm_crctc.
# For warmup, run with: model=cnn_bilstm_ctc lr_scheduler=linear_warmup_cosine_annealing
module:
  _target_: emg2qwerty.lightning.CNNBiLSTMCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  cnn_layers: 3
  cnn_kernel_size: 11
  lstm_hidden: 256
  lstm_layers: 2
  lstm_subsample: 2
  dropout: 0.05
  use_cr_ctc: false  # plain CTC
  cr_ctc_consistency_weight: 0.0
  cr_ctc_entropy_weight: 0.02

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
