# @package _global_
# Step-based warmup (first warmup_steps) then cosine decay. Use interval: step.
# total_steps is resolved at runtime from trainer (max_epochs * len(train_dataloader)).
lr_scheduler:
  scheduler:
    _target_: emg2qwerty.schedulers.LinearWarmupCosineAnnealingStepsLR
    warmup_steps: 500
    _total_steps_from_trainer: true
    warmup_start_lr: 1e-5  # higher start for warmup
    eta_min: 1e-6
  interval: step
  frequency: 1
